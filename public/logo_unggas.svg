  <circle cx="59.5" cy="58" r="1.8" fill="#1e293b" />

  <!-- Brand Label Ribbon -->
  <rect x="25" y="124" width="110" height="20" rx="10" fill="#1e293b" />
  <text x="80" y="138" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="800" fill="#fbbf24" text-anchor="middle" letter-spacing="1.5">BERKAH UNGGAS</text>
</svg>
