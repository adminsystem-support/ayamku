  <path d="M68 38 C64 30 54 28 48 34 C44 38 46 44 50 48 C44 48 40 54 44 60 C46 62 52 64 56 62 Z" fill="url(#redGrad)" />
  <path d="M60 48 C56 42 60 36 66 36 C72 36 74 44 70 48 Z" fill="url(#redGrad)" />

