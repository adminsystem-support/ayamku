    <rect width="100" height="420" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1.5" filter="url(#realShadow5)"/>
    <text x="50" y="28" font-family="system-ui" font-size="8" font-weight="bold" fill="#38bdf8" text-anchor="middle">ARUS KAS</text>

    <!-- Cash impact icons -->
    <g transform="translate(10, 50)">
      <rect width="80" height="100" rx="8" fill="#064e3b" stroke="#10b981"/>
      <text x="40" y="26" font-size="18" text-anchor="middle">💵</text>
      <text x="40" y="48" font-family="system-ui" font-size="7.5" font-weight="bold" fill="#ffffff" text-anchor="middle">KAS MASUK</text>
      <text x="40" y="65" font-family="system-ui" font-size="6.5" fill="#a7f3d0" text-anchor="middle">• Nota Tunai</text>
      <text x="40" y="78" font-family="system-ui" font-size="6.5" fill="#a7f3d0" text-anchor="middle">• Pelunasan</text>
    </g>

    <g transform="translate(10, 165)">
      <rect width="80" height="100" rx="8" fill="#450a0a" stroke="#ef4444"/>
      <text x="40" y="26" font-size="18" text-anchor="middle">💸</text>
      <text x="40" y="48" font-family="system-ui" font-size="7.5" font-weight="bold" fill="#ffffff" text-anchor="middle">KAS KELUAR</text>
      <text x="40" y="65" font-family="system-ui" font-size="6.5" fill="#fecaca" text-anchor="middle">• Beli Ayam</text>
      <text x="40" y="78" font-family="system-ui" font-size="6.5" fill="#fecaca" text-anchor="middle">• Bayar Hutang</text>
    </g>

    <g transform="translate(10, 280)">
      <rect width="80" height="90" rx="8" fill="#1e293b" stroke="#334155"/>
      <text x="40" y="24" font-family="system-ui" font-size="7" font-weight="bold" fill="#fbbf24" text-anchor="middle">KAS FISIK</text>
      <text x="40" y="42" font-family="system-ui" font-size="6.5" fill="#cbd5e1" text-anchor="middle">Laci Toko</text>
      <text x="40" y="58" font-family="system-ui" font-size="6.5" font-weight="bold" fill="#34d399" text-anchor="middle">Ans Chicken</text>
      <text x="40" y="72" font-family="system-ui" font-size="6" fill="#64748b" text-anchor="middle">Tangerang</text>
    </g>
