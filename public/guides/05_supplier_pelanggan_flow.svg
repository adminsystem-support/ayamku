      <text x="12" y="36" font-family="system-ui" font-size="8" fill="#64748b">Batas Kredit (Limit Plafon):</text>
      <text x="320" y="36" font-family="system-ui" font-size="8.5" font-weight="bold" fill="#0f172a" text-anchor="end">Rp 5.000.000</text>

      <text x="12" y="54" font-family="system-ui" font-size="8" fill="#64748b">Total Tagihan Berjalan:</text>
      <text x="320" y="54" font-family="system-ui" font-size="10.5" font-weight="900" fill="#d97706" text-anchor="end">Rp 1.450.000</text>

      <line x1="12" y1="64" x2="320" y2="64" stroke="#e2e8f0"/>

      <text x="12" y="82" font-family="system-ui" font-size="8" fill="#64748b">Nota Bon Terbuka:</text>
      <text x="320" y="82" font-family="system-ui" font-size="8" font-weight="bold" fill="#0284c7" text-anchor="end">NOTA-038 &amp; NOTA-041</text>

      <text x="12" y="100" font-family="system-ui" font-size="8" fill="#64748b">Sisa Plafon Kredit:</text>
      <text x="320" y="100" font-family="system-ui" font-size="8.5" font-weight="bold" fill="#059669" text-anchor="end">Rp 3.550.000 (Aman)</text>
