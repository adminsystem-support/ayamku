  <!-- Flow Connector -->
  <g transform="translate(405, 290)">
    <line x1="0" y1="0" x2="25" y2="0" stroke="#8b5cf6" stroke-width="3" stroke-linecap="round"/>
    <polygon points="25,-5 35,0 25,5" fill="#8b5cf6" />
