      <text x="320" y="100" font-family="system-ui" font-size="8.5" font-weight="bold" fill="#dc2626" text-anchor="end">TEMPO (14 HARI)</text>
      <text x="12" y="122" font-family="system-ui" font-size="7.5" fill="#94a3b8">Jatuh Tempo: 16 Nov 2026 • Hutang Dagang</text>
