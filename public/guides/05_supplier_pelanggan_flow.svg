<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <linearGradient id="appBgGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <filter id="realShadow5" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="540" fill="url(#appBgGrad5)" rx="16"/>

  <!-- Top System Header Banner -->
  <rect x="25" y="20" width="910" height="60" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <circle cx="58" cy="50" r="18" fill="#8b5cf6" />
  <text x="58" y="56" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle">5</text>
  <text x="92" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="800" fill="#ffffff">ALUR PROSES 5: PEMASOK, PELANGGAN &amp; HUTANG / PIUTANG</text>
  <text x="92" y="64" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#94a3b8">Sistem: <tspan fill="#f59e0b" font-weight="bold">Ans Chicken Group</tspan> • Tampilan persis master kontak, faktur tempo pembelian &amp; kartu piutang resto</text>

  <!-- LEFT: PEMASOK AYAM & FAKTUR PEMBELIAN (PembelianManagement.tsx) -->
  <g transform="translate(35, 96)">
    <rect width="360" height="420" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#realShadow5)"/>
    <rect width="360" height="40" rx="14" fill="#f8fafc"/>
    <text x="16" y="25" font-family="system-ui" font-size="10.5" font-weight="800" fill="#0f172a">🚚 Pemasok Ayam &amp; Faktur Beli</text>
    <line x1="0" y1="40" x2="360" y2="40" stroke="#e2e8f0"/>

    <!-- Supplier Profile Card -->
    <g transform="translate(14, 52)">
      <rect width="332" height="64" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
      <rect x="10" y="10" width="44" height="44" rx="8" fill="#f5f3ff" stroke="#ddd6fe"/>
      <text x="32" y="36" font-size="20" text-anchor="middle">🏭</text>
      <text x="64" y="24" font-family="system-ui" font-size="10" font-weight="800" fill="#0f172a">PT Berkah Farm (Peternak Mandiri)</text>
      <text x="64" y="38" font-family="system-ui" font-size="8" fill="#64748b">Mitra Ayam Broiler Hidup &amp; Karkas</text>
      <text x="64" y="50" font-family="system-ui" font-size="8" fill="#7c3aed">📍 Blitar • Telp: 0811-9876-543</text>
    </g>

    <!-- Purchase Transaction Simulation in PembelianManagement -->
    <g transform="translate(14, 126)">
      <text x="0" y="10" font-family="system-ui" font-size="8.5" font-weight="bold" fill="#334155">Faktur Pembelian Ayam Hidup:</text>
      <rect x="0" y="16" width="332" height="120" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>

      <text x="12" y="36" font-family="system-ui" font-size="8" fill="#64748b">No Faktur:</text>
      <text x="320" y="36" font-family="monospace" font-size="9" font-weight="bold" fill="#0f172a" text-anchor="end">FK-2026-089</text>

      <text x="12" y="54" font-family="system-ui" font-size="8" fill="#64748b">Ayam Hidup Broiler:</text>
      <text x="320" y="54" font-family="system-ui" font-size="8.5" font-weight="bold" fill="#0f172a" text-anchor="end">450.00 Kg @ Rp 21.500</text>

      <text x="12" y="72" font-family="system-ui" font-size="8" fill="#64748b">Total Nilai Faktur:</text>
      <text x="320" y="72" font-family="system-ui" font-size="10.5" font-weight="900" fill="#d97706" text-anchor="end">Rp 9.675.000</text>

      <line x1="12" y1="82" x2="320" y2="82" stroke="#e2e8f0"/>

