        <text x="10" y="42" font-family="system-ui" font-size="8" fill="#cbd5e1">Masuk: 450.00 Kg • Dari: PT Berkah Farm</text>
        <text x="10" y="54" font-family="system-ui" font-size="7.5" fill="#94a3b8">Faktur: FK-089 • Tempo 14 Hari</text>
